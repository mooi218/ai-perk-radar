name: Build Executa binaries

on:
  workflow_dispatch:

jobs:
  build:
    name: Build ${{ matrix.platform }}

    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux-x86_64
            runner: ubuntu-22.04

          - platform: windows-x86_64
            runner: windows-2025

          - platform: darwin-x86_64
            runner: macos-15-intel

          - platform: darwin-arm64
            runner: macos-15

    runs-on: ${{ matrix.runner }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install PyInstaller
        run: python -m pip install --upgrade pip pyinstaller

      - name: Run matcher regression tests
        run: python -m unittest discover -s executas/ai-perk-radar/tests -v

      - name: Run UI recommendation test
        run: node --test tests/test_ui_recommendation.mjs

      - name: Build Executa
        env:
          ANNA_RUNTIME_TOOL_ID: tool-chiku-ai-perk-radar-matcher-68rpuryp
        run: python executas/ai-perk-radar/build_binary.py

      - name: Upload Executa artifact
        uses: actions/upload-artifact@v4
        with:
          name: executa-${{ matrix.platform }}
          path: executas/ai-perk-radar/dist/*
          if-no-files-found: error
          retention-days: 14
