name: Test App behavior

on:
  push:
    paths:
      - bundle/**
      - executas/ai-perk-radar/**
      - tests/**
      - manifest.json
      - .github/workflows/test-app.yml
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  regression:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: node --test tests/*.mjs
      - run: python -m unittest discover -s executas/ai-perk-radar/tests -v
      - run: python -m unittest discover -s tests -p test_source_monitor.py -v
      - run: python scripts/check_catalog.py
